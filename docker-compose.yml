services:
  postgres:
    image: postgres:16
    container_name: tws_ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tws_ecommerce
      POSTGRES_USER: tws
      POSTGRES_PASSWORD: tws_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tws_ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
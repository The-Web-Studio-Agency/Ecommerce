[project]
name = "tws-ecommerce-backend"
version = "0.1.0"
description = "TWS multi-tenant e-commerce SaaS platform - backend API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# The engine and the test database are session-scoped, so tests must share the
# loop those were created on - asyncpg connections are bound to their loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = [
    # FastAPI dependency injection relies on function calls in argument defaults.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
